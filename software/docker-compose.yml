services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-examscan}
      MYSQL_USER: ${DB_USER:-examscan}
      MYSQL_PASSWORD: ${DB_PASSWORD:-examscan}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-examscan_root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - examscan_mysql_data:/var/lib/mysql

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  examscan_mysql_data:
