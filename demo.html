<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamScan Demo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #111;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 16px;
            padding: 16px;
            font-family: system-ui, sans-serif;
        }
        #viewer { position: relative; width: min(100%, 1200px); }
        img {
            width: 100%;
            max-height: calc(100vh - 190px);
            display: block;
            border: 2px solid #333;
            background: #000;
            object-fit: contain;
        }
        #flash {
            position: absolute;
            inset: 0;
            background: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.05s ease-in;
        }
        #flash.go { opacity: 1; }
        #handAlert {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(120, 0, 0, 0.72);
            color: #fff;
            font-size: 30px;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            pointer-events: none;
        }
        #handAlert.show { display: flex; }
        #handAlert.clearing { background: rgba(120, 82, 0, 0.72); }
        #handAlert .sub { font-size: 17px; font-weight: normal; opacity: 0.92; }
        #visionDiagnostics {
            position: absolute;
            top: 12px;
            left: 12px;
            display: none;
            padding: 9px 11px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.72);
            color: #dff7ff;
            font: 13px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
            white-space: pre;
            pointer-events: none;
            z-index: 3;
        }
        #visionDiagnostics.show { display: block; }
        #bedRegion {
            position: absolute;
            display: none;
            border: 2px dashed #5ce1e6;
            background: rgba(92, 225, 230, 0.05);
            pointer-events: none;
            z-index: 2;
        }
        #bedRegion.show { display: block; }
        #controls {
            width: min(100%, 1200px);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }
        button, a.button {
            min-height: 44px;
            padding: 10px 20px;
            font-size: 16px;
            background: #e63946;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
        }
        button.secondary, a.secondary { background: #2a9d8f; }
        button.capture-only { background: #457b9d; }
        button.detection-test { background: #6a4c93; }
        button.last-page { background: #e76f51; }
        button:hover:not(:disabled), a.button:hover { filter: brightness(0.9); }
        button:disabled { background: #555; cursor: default; }
        #meta { margin-left: auto; text-align: right; }
        #status { color: #ccc; font-size: 14px; min-width: 240px; }
        #status.error { color: #ff8fa3; }
        #status.busy { color: #ffd166; }
        #status.paused { color: #ff6b6b; font-weight: bold; }
        #counter { color: #4cc9f0; font-size: 14px; font-weight: bold; }
        #archiveLink[hidden] { display: none; }
    </style>
</head>
<body>
    <div id="viewer">
        <img id="feed" alt="Camera feed" />
        <div id="flash"></div>
        <div id="bedRegion"></div>
        <div id="visionDiagnostics"></div>
        <div id="handAlert">
            <div id="handTitle">&#9995; HAND DETECTED &mdash; WAITING FOR CLEAR</div>
            <div class="sub" id="handPhase"></div>
            <div class="sub" id="handInstruction">Clear the scan area to continue.</div>
        </div>
    </div>
    <div id="controls">
        <button id="captureBtn" class="capture-only" onclick="captureOnly()" disabled>Capture Image Only</button>
        <button id="detectionTestBtn" class="detection-test" onclick="testHandDetection()" disabled title="Moves the mechanism without capturing an image">Test Hand Detection — Move Only</button>
        <button id="scanBtn" onclick="scanStep()" disabled>Scan Page</button>
        <button id="lastPageBtn" class="last-page" onclick="scanLastPage()" disabled>Scan Last Page</button>
        <button id="autoBtn" class="secondary" onclick="autoScan()" disabled>Auto Scan</button>
        <button id="completeBtn" class="secondary" onclick="completeRun()" disabled>Finish Run</button>
        <a id="archiveLink" class="button secondary" hidden>Download Images (ZIP)</a>
        <div id="meta">
            <div id="status">Ready</div>
            <div id="counter">No run started</div>
        </div>
    </div>
    <script>
        let runId = null;
        let busy = false;
        let scanAreaReady = false;
        let handDetectionEnabled = false;

        document.addEventListener("keydown", (e) => {
            if (e.key === "Enter") scanStep();
        });

        // The stream connection dies on every capture: the server drops it while
        // reconfiguring the sensor from preview to stills. Any client of this API
        // has to re-point the img at /stream afterwards.
        function startStream() {
            const img = document.getElementById("feed");
            img.src = "/stream?" + Date.now();
            img.onerror = () => {
                // Capturing a still temporarily closes the MJPEG connection.
                // Keep reconnecting during a run so the live obstruction state
                // becomes visible again as soon as the preview stream returns.
                setTimeout(startStream, 1000);
            };
        }

        function setStatus(text, kind) {
            const el = document.getElementById("status");
            el.textContent = text;
            el.className = kind || "";
        }

        function setBusy(value, label) {
            busy = value;
            updateControls();
            if (label) setStatus(label);
        }

        function updateControls() {
            for (const id of ["captureBtn", "detectionTestBtn", "scanBtn", "lastPageBtn", "autoBtn", "completeBtn"]) {
                document.getElementById(id).disabled = busy || !scanAreaReady;
            }
        }

        function flash() {
            const f = document.getElementById("flash");
            f.classList.add("go");
            setTimeout(() => {
                f.style.transition = "opacity 0.4s ease-out";
                f.classList.remove("go");
                setTimeout(() => { f.style.transition = "opacity 0.05s ease-in"; }, 400);
            }, 80);
        }

        function showArchive(url) {
            const link = document.getElementById("archiveLink");
            if (!url) return;
            link.href = url;
            link.hidden = false;
        }

        function updateCount(count) {
            document.getElementById("counter").textContent =
                count + " page" + (count === 1 ? "" : "s") + " in current run";
        }

        let healthTimer = null;

        function displayNumber(value, digits = 1) {
            return typeof value === "number" ? value.toFixed(digits) : "--";
        }

        function updateVisionDiagnostics(detection) {
            const panel = document.getElementById("visionDiagnostics");
            const bed = document.getElementById("bedRegion");
            const enabled = detection.debug_overlay === true;
            panel.classList.toggle("show", enabled);
            if (!enabled) {
                bed.classList.remove("show");
                return;
            }
            panel.textContent = [
                `state       ${detection.state || "unknown"}`,
                `region      ${detection.region || "--"}`,
                `source      ${detection.source_width || "--"}x${detection.source_height || "--"}`,
                `rate        ${displayNumber(detection.effective_fps)} fps`,
                `inference   ${displayNumber(detection.inference_ms)} ms`,
                `palm        ${displayNumber(detection.palm_score, 3)}`,
                `presence    ${displayNumber(detection.presence_score, 3)}`,
                `exposure    ${displayNumber(detection.exposure_time_us, 0)} us`,
                `gain        ${displayNumber(detection.analogue_gain, 2)}`
            ].join("\n");

            const roi = detection.bed_roi;
            const showBed = detection.region === "bed" && Array.isArray(roi) && roi.length === 4;
            bed.classList.toggle("show", showBed);
            if (showBed) {
                bed.style.left = `${roi[0] * 100}%`;
                bed.style.top = `${roi[1] * 100}%`;
                bed.style.width = `${(roi[2] - roi[0]) * 100}%`;
                bed.style.height = `${(roi[3] - roi[1]) * 100}%`;
            }
        }

        function showObstructionAlert(health) {
            const detection = health.hand_detection || {};
            const state = detection.state || "unknown";
            const alert = document.getElementById("handAlert");
            const title = document.getElementById("handTitle");
            const instruction = document.getElementById("handInstruction");
            const isHand = detection.hand_present === true ||
                state === "confirmed" || state === "candidate";
            const isClearing = state === "clear" && detection.safe_to_move === false;

            alert.classList.add("show");
            alert.classList.toggle("clearing", isClearing);
            document.getElementById("handPhase").textContent = health.paused
                ? "Stopped at phase " + health.paused_phase
                : "Movement and capture are inhibited.";

            if (isHand) {
                title.innerHTML = "&#9995; HAND DETECTED &mdash; WAITING FOR CLEAR";
                instruction.textContent = "Remove the hand from the scan area to continue.";
                setStatus("Hand detected - waiting for clear", "paused");
            } else if (isClearing) {
                const count = detection.clear_count || 0;
                const required = detection.clear_frames || 1;
                title.textContent = "VERIFYING CLEAR SCAN AREA";
                instruction.textContent =
                    `Clear reading ${count} of ${required}; movement remains inhibited.`;
                setStatus("Verifying clear scan area...", "busy");
            } else {
                title.textContent = "VISION UNAVAILABLE — MOVEMENT INHIBITED";
                instruction.textContent = detection.reason ||
                    "Waiting for a valid camera reading.";
                setStatus("Vision unavailable - waiting", "paused");
            }
        }

        function hideHandAlert() {
            const alert = document.getElementById("handAlert");
            alert.classList.remove("show", "clearing");
        }

        async function pollHealth() {
            const wasReady = scanAreaReady;
            try {
                const response = await fetch("/api/health", { cache: "no-store" });
                const health = await response.json();
                const detection = health.hand_detection || {};
                updateVisionDiagnostics(detection);
                handDetectionEnabled = detection.mode !== "disabled" &&
                    detection.state !== "disabled";
                scanAreaReady = detection.safe_to_move !== undefined
                    ? detection.safe_to_move === true
                    : health.hand_present === false;
                updateControls();
                if (scanAreaReady) {
                    hideHandAlert();
                    if (!wasReady && !busy) setStatus("Scan area clear");
                } else {
                    showObstructionAlert(health);
                }
            } catch (error) {
                updateVisionDiagnostics({ debug_overlay: false });
                handDetectionEnabled = false;
                scanAreaReady = false;
                updateControls();
                showObstructionAlert({
                    paused: false,
                    hand_detection: {
                        state: "error",
                        safe_to_move: false,
                        reason: "The obstruction monitor could not be reached."
                    }
                });
            }
        }

        // Health is watched for the lifetime of the page, not only while a run
        // is active. This makes idle hand detections visible on the preview and
        // keeps controls disabled through the clear-frame debounce.
        function watchHealth() {
            if (healthTimer) return;
            pollHealth();
            healthTimer = setInterval(pollHealth, 250);
        }

        async function request(path, options) {
            const response = await fetch(path, options);
            const data = await response.json();
            if (response.status === 409) {
                const error = new Error(data.error || "Hardware busy");
                error.busy = true;
                throw error;
            }
            if (!response.ok) throw new Error(data.error || "Request failed");
            return data;
        }

        async function ensureRun() {
            if (runId) return runId;
            const data = await request("/api/runs", { method: "POST" });
            runId = data.run_id;
            document.getElementById("archiveLink").hidden = true;
            updateCount(0);
            return runId;
        }

        async function runAction(label, makeRequest, successMessage) {
            if (busy) return;
            setBusy(true, label);
            flash();
            try {
                const id = await ensureRun();
                const data = await makeRequest(id);
                updateCount(data.page_count);
                showArchive(data.archive_url);
                setStatus(successMessage
                    ? successMessage(data)
                    : "Saved " + data.page_count + " page" + (data.page_count === 1 ? "" : "s"));
                if (data.status === "complete") runId = null;
            } catch (error) {
                setStatus(error.message, error.busy ? "busy" : "error");
            } finally {
                setBusy(false);
                setTimeout(startStream, 1000);
            }
        }

        function scanStep() {
            return runAction("Scanning page...", (id) =>
                request(`/api/runs/${id}/scan-step`, { method: "POST" }));
        }

        function captureOnly() {
            return runAction(
                "Capturing image...",
                (id) => request(`/api/runs/${id}/capture`, { method: "POST" }),
                (data) => `Captured image (${data.page_count} page${data.page_count === 1 ? "" : "s"}); mechanism was not moved.`
            );
        }

        async function testHandDetection() {
            if (busy) return;
            if (!handDetectionEnabled) {
                setStatus("Hand detection is disabled; enable it and restart the backend before testing.", "error");
                return;
            }
            setBusy(true, "Testing hand detection — mechanism moving...");
            try {
                const id = await ensureRun();
                await request(`/api/runs/${id}/page-turn`, { method: "POST" });
                setStatus("Hand-detection movement test finished; no image was captured.");
            } catch (error) {
                setStatus(error.message, error.busy ? "busy" : "error");
            } finally {
                setBusy(false);
            }
        }

        function scanLastPage() {
            return runAction(
                "Scanning last page...",
                (id) => request(`/api/runs/${id}/scan-last-page`, { method: "POST" }),
                (data) => `Saved last page (${data.page_count} page${data.page_count === 1 ? "" : "s"}); finish the run when ready.`
            );
        }

        function autoScan() {
            // No body, so the server uses workflow.default_pages from config.
            return runAction("Auto scanning...", (id) =>
                request(`/api/runs/${id}/auto-scan`, { method: "POST" }));
        }

        async function completeRun() {
            if (busy || !runId) {
                setStatus("No run in progress", "error");
                return;
            }
            setBusy(true, "Finishing run...");
            try {
                const data = await request(`/api/runs/${runId}/complete`, { method: "POST" });
                showArchive(data.archive_url);
                setStatus("Run finished - " + data.page_count + " pages");
                runId = null;
            } catch (error) {
                setStatus(error.message, error.busy ? "busy" : "error");
            } finally {
                setBusy(false);
            }
        }

        window.onload = () => {
            startStream();
            watchHealth();
        };
    </script>
</body>
</html>
