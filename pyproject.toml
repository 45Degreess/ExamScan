[project]
name = "examscan"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.20",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "imutils>=0.5.4",
    "transformers>=4.46,<5",
    "torch>=2.5",
    "pillow>=10.4",
    "sentencepiece>=0.2.2",
    "easyocr>=1.7.2",
    "pytesseract>=0.3.13",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
pi = [
    "gpiozero>=2.0.1; sys_platform == 'linux'",
    "pigpio>=1.78; sys_platform == 'linux'",
    "picamera2>=0.3.36; sys_platform == 'linux'",
    "rpi-lgpio>=0.6; sys_platform == 'linux'",
    "rpimotorlib>=4.0.0; sys_platform == 'linux'",
    "ai-edge-litert>=1.0.1; sys_platform == 'linux'",
]

[project.scripts]
examscan = "main:main"
examscan-dev = "devserver:main"
examscan-demo = "demoserver:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "main.py",
    "devserver.py",
    "demoserver.py",
    "demo.html",
    "server.py",
    "fakes.py",
    "config.py",
    "runs.py",
    "hardware",
    "models",
    "software",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "tomli-w>=1.0",
]

[tool.pytest.ini_options]
# The partner FastAPI/OCR/session application runs on every development host.
# Root tests target the Pi hardware server and are invoked explicitly on a Pi.
testpaths = ["software/tests"]
pythonpath = ["."]

[[tool.uv.dependency-metadata]]
name = "python-prctl"
version = "1.8.1"
requires-dist = []
