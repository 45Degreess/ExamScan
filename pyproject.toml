[project]
name = "examscan"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.20",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "imutils>=0.5.4",
    "transformers>=4.46,<5",
    "torch>=2.5",
    "pillow>=10.4",
    "sentencepiece>=0.2.2",
    "easyocr>=1.7.2",
    "pytesseract>=0.3.13",
]

[project.optional-dependencies]
pi = [
    "picamera2>=0.3.36; sys_platform == 'linux'",
    "rpi-lgpio>=0.6; sys_platform == 'linux'",
    "rpimotorlib>=4.0.0; sys_platform == 'linux'",
]

[[tool.uv.dependency-metadata]]
name = "python-prctl"
version = "1.8.1"
requires-dist = []
