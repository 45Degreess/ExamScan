[project]
name = "examscan"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.20",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "imutils>=0.5.4",
    "transformers>=4.46,<5",
    "torch>=2.5",
    "pillow>=10.4",
    "sentencepiece>=0.2.2",
    "easyocr>=1.7.2",
    "pytesseract>=0.3.13",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "python-dotenv>=1.0",
    "argon2-cffi>=23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
examscan = "hardware_launcher:production"
examscan-dev = "hardware_launcher:development"
examscan-rig = "hardware_launcher:rig"

[tool.hatch.build.targets.wheel]
only-include = [
    "hardware_launcher.py",
    "software",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "tomli-w>=1.0",
]

[tool.pytest.ini_options]
# The partner FastAPI/OCR/session application runs on every development host.
# Root tests target the Pi hardware server and are invoked explicitly on a Pi.
testpaths = ["software/tests"]
pythonpath = ["."]

[[tool.uv.dependency-metadata]]
name = "python-prctl"
version = "1.8.1"
requires-dist = []
