[project]
name = "examscan"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gpiozero>=2.0.1",
    "pigpio>=1.78",
    "picamera2>=0.3.36",
    "rpi-lgpio>=0.6",
    "rpimotorlib>=4.0.0",
    "ai-edge-litert>=1.0.1",
    "opencv-python-headless>=4.10",
]

[project.scripts]
examscan = "main:main"
examscan-dev = "devserver:main"
examscan-demo = "demoserver:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "main.py",
    "devserver.py",
    "demoserver.py",
    "demo.html",
    "server.py",
    "fakes.py",
    "config.py",
    "runs.py",
    "hardware",
    "models",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pillow>=11.0.0",
    "tomli-w>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
