[server]
host = "0.0.0.0"
port = 8000
cors_enabled = true
cors_allowed_origins = ["*"]

[paths]
runs_dir = "runs"

[camera]
lens_position = 0.94
preview_width = 1920
preview_height = 1080
capture_width = 4608
capture_height = 2592
frame_rate = 30
buffer_count = 6
recording_start_delay = 3.0
capture_stop_delay = 0.2
capture_settle_delay = 0.5
capture_restart_delay = 0.2

[motor]
step_pin = 21
dir_pin = 20
enable_pin = 16
# Step pulses per revolution, not full steps: 200 full steps x 8 microsteps.
# The TMC2209 defaults to 1/8 microstepping with MS1/MS2 unconnected, where the
# DRV8825 it replaced defaulted to full steps.
steps_per_rev = 1600
step_delay = 0.002
fast_delay = 0.001
default_turn_seconds = 3.0
default_degrees = 190.0
default_clockwise = true

[servos.page_drop]
pin = 12
min_angle = 0
max_angle = 180
min_pulse_width = 0.0005
max_pulse_width = 0.0025
frame_width = 0.02
step_degrees = 3.0
step_delay = 0.015
approach_degrees = 40.0
approach_step_degrees = 1.0
approach_step_delay = 0.04
departure_degrees = 10.0
departure_step_degrees = 0.5
departure_step_delay = 0.08
down_angle = 95
up_angle = 0
default_settle_time = 0.4
detach_after_move = true
pin_factory = "pigpio"

[servos.page_clamp_right]
pin = 27
min_angle = 0
max_angle = 180
min_pulse_width = 0.0005
max_pulse_width = 0.0025
frame_width = 0.02
step_degrees = 3.0
step_delay = 0.015
approach_degrees = 40.0
approach_step_degrees = 1.0
approach_step_delay = 0.04
departure_degrees = 10.0
departure_step_degrees = 0.5
departure_step_delay = 0.08
down_angle = 90
up_angle = 0
default_settle_time = 0.4
detach_after_move = true
pin_factory = "pigpio"

[servos.page_clamp_left]
pin = 19
min_angle = 0
max_angle = 180
min_pulse_width = 0.0005
max_pulse_width = 0.0025
frame_width = 0.02
step_degrees = 3.0
step_delay = 0.015
approach_degrees = 40.0
approach_step_degrees = 1.0
approach_step_delay = 0.04
departure_degrees = 10.0
departure_step_degrees = 0.5
departure_step_delay = 0.08
down_angle = 73
up_angle = 0
default_settle_time = 0.4
detach_after_move = true
pin_factory = "pigpio"

[fan]
pin = 18
frequency_hz = 25000
min_start_duty_pct = 10
tach_pin = 17
tach_pulses_per_rev = 2

[workflow]
# Pauses between the page-turn phases: drop clamp, drop arm, spin wheel,
# stepper out (first half), lift clamp, stepper out (second half), lift arm,
# return stepper.
clamp_down_pause = 1.0
servo_down_pause = 1.0
clamp_up_pause = 0.5
stepper_pause = 1.0
servo_up_pause = 1.0
default_pages = 7
